<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A water photograph brought to life with subtle motion.">
<title>Pour — Water Study</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23091625'/%3E%3Cpath d='M32 10C24 21 17 29 17 40a15 15 0 0030 0c0-11-7-19-15-30z' fill='%236bd4ff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<script src="motion.js" defer></script>
</head>
<body>
<main class="stage">
  <header class="caption">
    <p class="eyebrow">STUDY 01 / FLUID</p>
    <h1>Pour</h1>
    <p class="note">Glass, water, light.</p>
    <p class="compare-link"><a href="compare/">Open water studies →</a></p>
  </header>
  <figure class="scene">
    <!-- Photo pixels supply every detail; masks keep the glass and background still. -->
    <svg id="water-scene" viewBox="0 0 417 422" role="img" aria-labelledby="scene-title scene-description">
      <title id="scene-title">Water pouring into a clear glass</title>
      <desc id="scene-description">The original photograph with subtle animated refraction in the stream, water, and puddle.</desc>
      <defs>
        <filter id="feather" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
        <mask id="stream-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="417" height="422">
          <path fill="white" filter="url(#feather)" d="M253 -10 L288 -10 L264 33 L252 66 L239 99 L229 132 L215 167 L204 196 L198 218 L178 211 L189 179 L199 147 L210 113 L225 78 L237 42 Z"/>
        </mask>
        <mask id="water-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="417" height="422">
          <path fill="white" filter="url(#feather)" d="M145 189 Q165 208 181 207 Q206 202 228 220 Q261 235 288 212 L288 282 Q279 301 219 301 Q164 302 146 282 Z"/>
        </mask>
        <mask id="puddle-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="417" height="422">
          <path fill="white" filter="url(#feather)" d="M96 359 Q185 350 253 357 Q316 354 341 393 Q302 405 249 389 Q197 379 145 402 L88 413 L65 395 L139 376 Z"/>
        </mask>
        <filter id="stream-refraction" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency=".047 .022" numOctaves="2" seed="8" result="noise">
            <animate attributeName="baseFrequency" values=".047 .022;.059 .035;.043 .029;.047 .022" dur="2.6s" repeatCount="indefinite"/>
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="water-refraction" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency=".025 .052" numOctaves="2" seed="21" result="noise">
            <animate attributeName="baseFrequency" values=".025 .052;.034 .068;.029 .044;.025 .052" dur="3.8s" repeatCount="indefinite"/>
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="11" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="puddle-refraction" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency=".016 .075" numOctaves="1" seed="4" result="noise">
            <animate attributeName="baseFrequency" values=".016 .075;.023 .095;.016 .075" dur="5s" repeatCount="indefinite"/>
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
      <image href="water-reference.png" width="417" height="422"/>
      <g mask="url(#stream-mask)"><image href="water-reference.png" width="417" height="422" filter="url(#stream-refraction)"/></g>
      <g mask="url(#water-mask)"><image href="water-reference.png" width="417" height="422" filter="url(#water-refraction)"/></g>
      <g mask="url(#puddle-mask)"><image href="water-reference.png" width="417" height="422" filter="url(#puddle-refraction)"/></g>
    </svg>
  </figure>
  <button class="control" id="motion" type="button" aria-label="Play animation" aria-pressed="false">
    <span class="control__drop" aria-hidden="true"><span id="motion-icon">▶</span></span>
    <span class="control__label" id="motion-label">Play</span>
  </button>
</main>
</body>
</html>
