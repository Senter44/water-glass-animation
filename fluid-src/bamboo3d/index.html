<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A hollow Blender bamboo model with interactive Splash WebGPU liquid."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e231b'/%3E%3Cpath d='M27 8L12 13v5L27 13' fill='%238ba663'/%3E%3Cpath d='M11 21q-5 7 0 7t0-7' fill='%23d7eee2'/%3E%3C/svg%3E"><title>Bamboo · 3D water</title></head>
<body>
  <main>
    <canvas id="scene" tabindex="0" aria-label="Interactive 3D bamboo and water. Drag to raise or lower the bamboo; use the orbit control to inspect the opening."></canvas>
    <header><a href="../compare/#bamboo" aria-label="Back to water studies">← Water studies</a><h1>Bamboo</h1><p>Real-time 3D · drag to pour</p></header>
    <div class="hint">Lower the spout. Watch the water find its way.</div>
    <div id="message" role="status">Preparing the 3D scene…</div>
    <form id="controls" aria-label="Scene controls" onsubmit="return false">
      <label class="height">Bamboo height <input id="height" type="range" min="0" max="100" value="30"><span>Lower <span>Higher</span></span></label>
      <label>Drag to <select id="interaction"><option value="tilt">Move bamboo</option><option value="orbit">Orbit camera</option></select></label>
      <button type="button" id="pause" aria-pressed="false">Pause</button>
      <button type="button" id="reset">Reset water</button>
      <output id="status" aria-live="off">Starting</output>
    </form>
    <footer><span>Blender geometry · Splash liquid</span><a href="./bamboo.glb" download>3D model</a><a href="../bamboo/">Previous study</a></footer>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
